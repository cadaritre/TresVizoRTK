[platformio]
default_envs = esp32s3_usb

[env:esp32s3_usb]
platform = platformio/espressif32@6.12.0
board = sparkfun_thing_plus_esp32s3
framework = arduino
; SparkFun Thing Plus WRL-24408: MINI-1-N4R2, flash 4 MB y PSRAM Quad 2 MB.
; esp32s3_usb se conserva como nombre de entorno para las herramientas USB.
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.partitions = partitions.csv
board_build.arduino.memory_type = dio_qspi
board_build.flash_mode = dio
board_build.f_flash = 80000000L
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
    -Wall
    -Wextra
    ; UART, I2C y SDIO definidos en include/board_profile.h.
    -DSSD1306_NO_SPLASH
    ; Watchdog de las tareas propias: convierte un bloqueo en un reinicio. Un
    ; equipo colgado en un tripode obliga a ir fisicamente hasta el.
    -DTRESVIZO_TASK_WDT
lib_deps =
    bblanchon/ArduinoJson@7.4.2
    adafruit/Adafruit SSD1306@2.5.17
    adafruit/Adafruit GFX Library@1.12.6
    adafruit/Adafruit BusIO@1.17.4
; Tras compilar, firmware-signed.bin al lado de firmware.bin si la clave del
; propietario está en esta Mac (sin clave: aviso, y la compilación sigue). Es el
; único que el equipo acepta por OTA. Ver tools/firmware_signing/README.md.
extra_scripts =
    pre:scripts/embed_web.py
    post:../../tools/firmware_signing/platformio_sign.py
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
upload_speed = 460800

; MeridianV con la placa principal v0.3 compacta (hardware/main-board, pedido a
; JLCPCB en 97000ef): ESP32-S3-WROOM-1-N16R2 soldado (16 MB de flash quad, 2 MB
; de PSRAM quad), UM980 en la carrier BDLX por J301, cargador BQ25798, medidor
; MAX17048, OLED, BMI088, microSD, botón y LED. Pines en include/board_profile_v03.h
; (sacados del netlist; tools/board_check/check_v03_pins.py los compara).
; Arranque en placa nueva: docs/board-v03-bringup.md.
[env:meridianv_v03]
platform = platformio/espressif32@6.12.0
board = tresvizo_meridianv_v03
framework = arduino
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions_v03.csv
board_build.arduino.memory_type = qio_qspi
board_build.flash_mode = qio
board_build.f_flash = 80000000L
build_flags =
    -DTRESVIZO_BOARD_V03
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
    -Wall
    -Wextra
    -DSSD1306_NO_SPLASH
    -DTRESVIZO_TASK_WDT
lib_deps =
    bblanchon/ArduinoJson@7.4.2
    adafruit/Adafruit SSD1306@2.5.17
    adafruit/Adafruit GFX Library@1.12.6
    adafruit/Adafruit BusIO@1.17.4
extra_scripts =
    pre:scripts/embed_web.py
    post:../../tools/firmware_signing/platformio_sign.py
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
upload_speed = 460800
