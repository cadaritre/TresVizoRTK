[platformio]
default_envs = esp32s3_usb

[env:esp32s3_usb]
platform = platformio/espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
; Perfil genérico de CPU; la carrier no se identifica como DevKitC.
; Flash quad de 4 MB comprobada por esptool. PSRAM Quad de 2 MB; prueba de integridad al arrancar.
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.partitions = partitions.csv
board_build.arduino.memory_type = dio_qspi
board_build.flash_mode = dio
board_build.f_flash = 80000000L
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
    -Wall
    -Wextra
    ; Cableado confirmado: TTL_TXD2 -> GPIO18, TTL_RXD2 -> GPIO17, GND común.
    -DTRESVIZO_GNSS_RX=18
    -DTRESVIZO_GNSS_TX=17
    -DTRESVIZO_GNSS_BAUD=115200
    ; Watchdog de las tareas propias: convierte un bloqueo en un reinicio. Un
    ; equipo colgado en un tripode obliga a ir fisicamente hasta el.
    -DTRESVIZO_TASK_WDT
lib_deps = bblanchon/ArduinoJson@7.4.2
; Tras compilar, firmware-signed.bin al lado de firmware.bin si la clave del
; propietario está en esta Mac (sin clave: aviso, y la compilación sigue). Es el
; único que el equipo acepta por OTA. Ver tools/firmware_signing/README.md.
extra_scripts =
    pre:scripts/embed_web.py
    post:../../tools/firmware_signing/platformio_sign.py
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
upload_speed = 460800

; Meridian3: el receptor sencillo (ESP32-S3 + UM980 + power bank externo por
; USB-C). Mismo código y misma placa; cambia la identidad (nombre, red,
; meridian3.local, hardware_id de la OTA) y no arranca lo que no lleva (microSD).
; Ver lib/protocol/src/product.h. `pio run -e meridian3`.
[env:meridian3]
extends = env:esp32s3_usb
build_flags =
    ${env:esp32s3_usb.build_flags}
    -DTRESVIZO_PRODUCT_MERIDIAN3
