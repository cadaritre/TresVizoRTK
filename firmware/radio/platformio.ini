; Módulo de radio LoRa del MeridianV (docs/radio/RADIO_MODULE.md): un ESP32-S3 con una
; Ebyte E22-900M30S (SX1262 + amplificador, hasta 1 W a 915 MHz; el firmware la limita a
; 27 dBm). Aparato aparte con su propia pila: se conecta al USB-C del MeridianV, del que
; es el anfitrión USB, y por ese cable pasa el RTCM (docs/radio/USB_LINK.md).
[platformio]
default_envs = radio

[env:radio]
platform = platformio/espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
; Perfil genérico de ESP32-S3: la placa del radio aún no está elegida. 4 MB de flash es
; lo mínimo de cualquier ESP32-S3 y sirve en placas con más.
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
lib_deps =
    jgromes/RadioLib@7.1.2
    bblanchon/ArduinoJson@7.4.2
build_flags =
    ; El USB nativo (GPIO19/20) es el enlace con el MeridianV, como anfitrión: la consola
    ; de depuración y la carga del firmware van por UART0 (puente USB-UART de la placa).
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=0
    -Wall
    -Wextra
    ; Protocolo compartido con el firmware del MeridianV (radio_air.h, signed_firmware.h)
    ; y el parser RTCM3 con CRC-24Q. El entramado USB (src/radio_usb.h) también lo usará
    ; el MeridianV.
    -I ../esp32/lib/protocol/src
    -I ../esp32/lib/gnss/src
    ; Cableado de la E22-900M30S (SPI + BUSY, DIO1, NRST y los dos pines del conmutador
    ; de antena). **Por confirmar con la placa real**: cámbialos aquí, no en el código.
    -DRADIO_PIN_SCK=12
    -DRADIO_PIN_MISO=13
    -DRADIO_PIN_MOSI=11
    -DRADIO_PIN_NSS=10
    -DRADIO_PIN_BUSY=9
    -DRADIO_PIN_DIO1=8
    -DRADIO_PIN_NRST=7
    -DRADIO_PIN_TXEN=6
    -DRADIO_PIN_RXEN=5
    ; LED de estado (-1 = sin LED).
    -DRADIO_PIN_LED=-1
    ; Tensión de la pila por un divisor a un ADC (-1 = sin medir; `battery_mv` va null).
    -DRADIO_PIN_VBAT=-1
    -DRADIO_VBAT_DIVIDER=2.0f
    ; La E22-900M30S lleva TCXO alimentado por DIO3 (1.8 V según Ebyte). Por confirmar.
    -DRADIO_TCXO_VOLTS=1.8
; Pruebas nativas del entramado y del saludo: python3 tools/firmware_tests/run_native.py
test_ignore = *
monitor_speed = 115200
upload_speed = 460800
